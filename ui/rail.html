<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>角色与对话</title>
<!--
  functionPanel 页：渲染进 Hana 全局左栏（ComfyUI 的 panel.html、Token 的
  navigation.html 是同一路子）。

  契约要点（比对两份样板得出）：
    - 背景透明，宿主给外框与边距，不自带大底色
    - 字号 11–12px，紧凑
    - 样式自包含，不依赖 card 那套 characters.css
-->
<style>
:root {
  --t: #3d3427; --tm: #8a7c63; --ac: #e08a3c;
  --line: rgba(224,138,60,.22); --card: rgba(224,138,60,.07);
  --ok: #5a9e6f; --bad: #d9534f;
}
body.t-dark {
  --t: #e8e0d0; --tm: #9c8f78; --ac: #f0a94e;
  --line: rgba(240,169,78,.24); --card: rgba(240,169,78,.10);
}
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; }
body {
  margin: 0; padding: 10px 11px;
  background: transparent; color: var(--t);
  font: 11.5px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
}
/*
  标题全是中文——`text-transform: uppercase` 一个像素都不起作用，
  是从某个英文模板抄来的残留。删掉，别让人以为这里本该是大写。
*/
h2 {
  font-size: 11px; font-weight: 700; letter-spacing: .05em;
  color: var(--tm);
  margin: 12px 2px 6px; display: flex; align-items: center; gap: 6px;
}
h2:first-child { margin-top: 0; }
h2 .n { font-weight: 400; opacity: .7; font-variant-numeric: tabular-nums; }
h2 .act { margin-left: auto; cursor: pointer; color: var(--ac); font-size: 12px; padding: 0 3px; }
h2 .act:hover { opacity: .7; }

#q {
  width: 100%; padding: 5px 9px; font-size: 11.5px; font-family: inherit;
  border: .5px solid var(--line); border-radius: 7px;
  background: var(--card); color: var(--t);
}
#q:focus { outline: none; border-color: var(--ac); }
#q::placeholder { color: var(--tm); }

.item {
  position: relative;
  display: flex; align-items: center; gap: 7px;
  padding: 6px 7px; border-radius: 7px; cursor: pointer;
  transition: background .15s;
}
.item:hover { background: var(--card); }
.item.on { background: var(--card); box-shadow: inset 2px 0 0 var(--ac); }
.item img.ava, .item .ph {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  object-fit: cover; background: var(--card);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--tm);
  line-height: 1;
}
.item .bd { flex: 1; min-width: 0; }
.item .nm {
  font-size: 12px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item.on .nm { color: var(--ac); }
.item .mt {
  font-size: 10px; color: var(--tm); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--ok); box-shadow: 0 0 0 3px rgba(90,158,111,.16);
}

/*
  会话删除按钮（两步内联确认）。
  设计目标：**平时不存在**——rail 是窄栏导航，常驻删除键会把每一行都变成
  危险区（上一版截图里它们排成一列大方块，比标题还抢眼）。
  只在 hover / focus / 已按下一次时浮现。
*/
.item .conv-del {
  position: absolute;
  top: 4px; right: 4px;
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
  border: none; border-radius: 6px;
  background: transparent; color: var(--tm);
  font-size: 11px; line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
}
.item:hover .conv-del,
.item:focus-within .conv-del,
.item .conv-del[data-armed="1"] { opacity: 1; }
.item .conv-del:hover { background: var(--card); color: var(--ac); }
/* 已按下待确认：用主色描边，不是恐吓红——二次确认是防误点，不是警告 */
.item .conv-del[data-armed="1"] {
  color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
}

/*
  页脚从四个按钮收成 2 + 「⋯」。
  宿主给这一列的宽度是窄的（约 230px），四个按钮挤一行必然折行——
  「✧ AI 生成卡与世界书」十个字塞进一格，压到别个按钮只能一字一行。

  分法：两个高频的并排（新对话·主色 / 新角色），两个低频的收进「⋯」。
  低频指的是：导入卡是搬家时偶尔用一次，AI 生成是想不出角色时试一次——
  都值得有入口，但不值得各占一行宽度。
*/
.foot {
  display: flex; gap: 6px; margin-top: 11px; align-items: center;
}
.foot button {
  flex: 1 1 0; min-width: 0; font-size: 11.5px; padding: 7px 4px; font-family: inherit;
  border: .5px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--tm); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.foot button:hover { background: var(--card); color: var(--ac); border-color: var(--ac); }
.foot .p {
  background: var(--ac); color: #fff; border-color: var(--ac);
}
.foot .p:hover { color: #fff; opacity: .92; }
.foot .more {
  flex: 0 0 36px; font-size: 13px; padding: 5px 4px; line-height: 1;
}

.moremenu {
  margin-top: 6px; border: .5px solid var(--line); border-radius: 8px;
  overflow: hidden; background: var(--card);
}
.moremenu.hidden { display: none; }
.moremenu button {
  width: 100%; display: flex; align-items: center; gap: 8px;
  font: inherit; font-size: 11.5px; padding: 7px 10px;
  border: none; border-top: .5px solid var(--line);
  background: transparent; color: var(--tm); cursor: pointer; text-align: left;
}
.moremenu button:first-child { border-top: none; }
.moremenu button:hover { background: rgba(224,138,60,.10); color: var(--ac); }
.moremenu .mnote {
  margin-left: auto; font-size: 10px; opacity: .7;
}
.empty { color: var(--tm); font-size: 11px; padding: 10px 4px; line-height: 1.6; }
.err { color: var(--bad); font-size: 11px; padding: 8px 4px; word-break: break-all; }
</style>
</head>
<body>
  <input id="q" type="search" placeholder="搜索角色 / 对话…">
  <div id="chars"></div>
  <!--
    原本这里挂着一个 ↻（#conv-refresh）。它是第九个「刷新」：
    七个抽屉 + 一个预览弹窗 + 这里，全绑 load*。但左栏是宿主的面板——
    打开就加载、切回来会重载，它从来没有需要手按的时刻。
  -->
  <h2>最近对话 <span class="n" id="conv-n"></span></h2>
  <div id="convs"></div>
  <div class="foot">
    <button id="new-conv" class="primary" title="开一场新对话">+ 新对话</button>
    <button id="new-char" title="新建一张角色卡">+ 角色</button>
    <button id="rail-more" class="more" type="button" title="更多" aria-expanded="false">⋯</button>
  </div>
  <!--
    两个低频动作收进「⋯」。
    导入卡：偶尔搬家时用一次；AI 生成：想不出角色时试一次。
    保持 rail-import / gen-open 的原 id，rail.js 里那两处绑定不用改。
  -->
  <div id="rail-more-menu" class="moremenu hidden" role="menu">
    <button id="rail-import" type="button" title="导入角色卡（.json / ST 卡）">⤓ 导入角色卡<span class="mnote">.json / ST 卡</span></button>
    <button id="gen-open" type="button" title="联网检索资料，生成一张卡 + 一套世界书">✧ AI 生成一张卡<span class="mnote">含世界书</span></button>
  </div>
  <script type="module" src="./assets/rail.js"></script>
</body>
</html>
