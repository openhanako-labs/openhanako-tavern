<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="ElecKoi Tavern">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- 远山：两层剪影，酒馆窗外那种感觉 -->
  <path d="M0 132 L44 96 L78 124 L118 84 L162 126 L206 92 L250 128 L292 100 L320 130 V180 H0 Z" fill="#1b2331"/>
  <path d="M0 150 L52 122 L96 146 L146 116 L196 148 L248 120 L320 152 V180 H0 Z" fill="#232d3d"/>
  <!-- 窗：暖光，表示有人在里面 -->
  <rect x="196" y="52" width="46" height="40" rx="3" fill="#e8b764" opacity="0.9"/>
  <rect x="196" y="52" width="46" height="40" rx="3" fill="none" stroke="#3a3122" stroke-width="2"/>
  <line x1="219" y1="52" x2="219" y2="92" stroke="#3a3122" stroke-width="2"/>
  <line x1="196" y1="72" x2="242" y2="72" stroke="#3a3122" stroke-width="2"/>
  <!-- 烟囱与炊烟 -->
  <rect x="96" y="70" width="12" height="26" fill="#2b3547"/>
  <circle cx="102" cy="62" r="5" fill="#3a465c" opacity="0.7"/>
  <circle cx="107" cy="52" r="4" fill="#3a465c" opacity="0.5"/>
  <!-- 标题 -->
  <text x="20" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="#f2f5fa">ElecKoi Tavern</text>
  <text x="20" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8b98ad">角色卡 · 对话 · 世界书 · 预设</text>
</svg>
